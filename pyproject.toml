[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexor-x"
version = "0.10.0"
description = "NEXOR X quantitative trading operating system market intelligence, resilient data and command center"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9","pytest-asyncio>=0.24,<1","pytest-cov>=5,<7","ruff>=0.6,<1"]
[project.scripts]
nexor-x = "nexor_x.main:run"
nexor-lab-import = "nexor_x.laboratory.importer:main"
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E","F","I","B","UP","ASYNC"]
