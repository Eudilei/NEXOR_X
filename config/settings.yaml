system:
  mode: PAPER
  host: 127.0.0.1
  port: 8809
  log_level: INFO
  database_path: data/nexor_x.db
  allow_live_mode: false
  admin_api_token: ""

binance:
  api_key: ""
  api_secret: ""
  testnet: false

telegram:
  bot_token: ""
  chat_id: ""

ollama:
  base_url: http://127.0.0.1:11434
  model: llama3.2:3b

market:
  cache_ttl_seconds: 15
  stale_after_seconds: 120
  failure_cooldown_seconds: 60


risk:
  initial_paper_equity: 100.0
  risk_per_trade_pct: 10.0
  leverage: 15.0
  max_open_positions: 10
  hard_stop_drawdown_pct: 25.0
  minimum_expected_r: 0.05
  minimum_profit_factor: 1.10
  minimum_calibration_samples: 30
  paper_fee_rate: 0.0005
  paper_slippage_rate: 0.0003
  paper_stop_loss_pct: 0.01

scanner:
  enabled: true
  symbols: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT
  interval_seconds: 60
  concurrency: 4
  top_candidates: 10

causal_shadow:
  enabled: true
  interval_seconds: 60

position_management:
  break_even_trigger_r: 0.8
  break_even_buffer_r: 0.05
  partial_trigger_r: 1.5
  partial_fraction: 0.35
  trailing_start_r: 2.0
  trailing_distance_r: 0.8

edge_discovery:
  maximum_fdr: 0.10

probability_calibration:
  minimum_samples: 60
  holdout_fraction: 0.25
  kelly_fraction: 0.25


monte_carlo:
  minimum_observations: 60
  simulations: 5000
  horizon_trades: 250
  block_size: 10
  ruin_drawdown_pct: 25.0
  seed: 20260803


walk_forward:
  folds: 5
  minimum_train_observations: 60
  minimum_test_observations: 20
  minimum_pass_ratio: 0.60
  minimum_profit_factor: 1.05

counterfactual:
  minimum_observations: 60
  minimum_kept_observations: 20
  edge_thresholds: 0.10,0.20,0.30,0.40,0.50

allocation:
  maximum_candidates: 5
  maximum_weight_per_candidate: 0.35
  maximum_weight_per_correlation_group: 0.55
  minimum_score: 0.20
  maximum_ruin_probability: 0.05
  maximum_candidate_drawdown_r: 8.0
  recovery_drawdown_trigger_pct: 10.0
  recovery_risk_multiplier: 0.35

certification:
  minimum_paper_trades: 1000
  minimum_profit_factor: 1.40
  minimum_expected_r: 0.05
  maximum_drawdown_pct: 15.0
  minimum_walk_forward_pass_ratio: 0.70
  maximum_ruin_probability: 0.02
  maximum_brier_score_oos: 0.24
  maximum_ece_oos: 0.08
  minimum_days_in_paper: 30
  minimum_recent_profit_factor: 1.15
  minimum_recent_expected_r: 0.01

binance_live:
  base_url: https://fapi.binance.com
  testnet_url: https://testnet.binancefuture.com
  timeout_seconds: 10.0
  recv_window_ms: 5000
  maximum_time_drift_ms: 1000
  use_testnet: true
